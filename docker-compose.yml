services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      VAULT_ADDR: http://vault:8200
      MINIO_ENDPOINT: minio:9000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - db
      - redis
      - vault
      - minio

  model_server:
    build:
      context: .
      dockerfile: docker/model_server.Dockerfile
    ports:
      - "${MODEL_SERVER_PORT:-8001}:8001"

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maintainers_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-maintainers_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      VAULT_ADDR: http://vault:8200
      MINIO_ENDPOINT: minio:9000
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
